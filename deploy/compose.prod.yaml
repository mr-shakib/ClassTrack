# Production stack: Caddy terminates TLS and routes to the API and the web app.
#
# Caddy fetches and renews its Let's Encrypt certificate on its own, so there is
# no certificate to manage and nothing to rotate by hand.
#
#   docker compose -f deploy/compose.prod.yaml up -d --build
services:
  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      CLASSTRACK_ENVIRONMENT: production
      CLASSTRACK_LOG_LEVEL: INFO
      # SQLite on a named volume: it survives container rebuilds and reboots.
      # One department-semester of monitoring data, and the file itself is the
      # backup -- see the README.
      CLASSTRACK_DATABASE_URL: sqlite+aiosqlite:////data/classtrack.db
      CLASSTRACK_JWT_SECRET: ${CLASSTRACK_JWT_SECRET:?set a long random value in .env}
      CLASSTRACK_COOKIE_SECURE: "true"
      # Same-origin behind Caddy, so no cross-origin credentials are needed.
      CLASSTRACK_CORS_ORIGINS: ${CLASSTRACK_CORS_ORIGINS:-https://${CLASSTRACK_DOMAIN}}
      CLASSTRACK_TIMEZONE: ${CLASSTRACK_TIMEZONE:-Asia/Dhaka}
      CLASSTRACK_MISSED_THRESHOLD_MINUTES: ${CLASSTRACK_MISSED_THRESHOLD_MINUTES:-30}
      CLASSTRACK_CHECK_WINDOW_MINUTES: ${CLASSTRACK_CHECK_WINDOW_MINUTES:-30}
      # The status sweep runs inside this process. Keep exactly one replica:
      # two would both try to finalise the same rows.
      CLASSTRACK_SWEEP_INTERVAL_SECONDS: "60"
    volumes:
      - classtrack-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ../web
      args:
        # Next.js compiles rewrites at build time, so this has to be set here.
        # Behind Caddy the rewrite never fires -- Caddy routes /api/* to the API
        # container directly -- but it keeps the image correct on its own too.
        API_ORIGIN: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:8000
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLASSTRACK_DOMAIN: ${CLASSTRACK_DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  classtrack-data:
  caddy-data:
  caddy-config:
