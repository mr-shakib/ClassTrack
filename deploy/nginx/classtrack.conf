# ClassTrack behind a host nginx -- pairs with deploy/compose.nginx.yaml.
#
# Install as /etc/nginx/sites-available/<domain>, symlink it into
# sites-enabled, then `nginx -t && systemctl reload nginx`. Get the certificate
# first with the port-80 block alone:
#
#   certbot certonly --webroot -w /var/www/certbot -d class.bitstreamhq.com

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name class.bitstreamhq.com;

    ssl_certificate     /etc/letsencrypt/live/class.bitstreamhq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/class.bitstreamhq.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Routine PDFs are uploaded through /admin.
    client_max_body_size 25M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    # The API and the web app share one origin, which keeps the session cookie
    # same-site with no CORS credentials handling anywhere.
    location /api/ {
        proxy_pass http://127.0.0.1:8310;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name class.bitstreamhq.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / { return 301 https://$host$request_uri; }
}
